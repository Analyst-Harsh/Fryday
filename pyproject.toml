# Virtual workspace root: no [project] table, just shared tool config and the
# dev group. Install everything with `make sync` (uv sync --all-packages).
[tool.uv.workspace]
# Add new members (ml/, eval/) here AND to pyright `include` + pytest `testpaths`.
members = ["app"]

[tool.uv]
required-version = ">=0.11"

[dependency-groups]
dev = [
    "lefthook>=2.1",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
# Throwaway spike code shouldn't block commits.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "N",     # pep8-naming
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "PT",    # flake8-pytest-style
    "DTZ",   # flake8-datetimez (no naive datetimes)
    "ASYNC", # flake8-async
    "ARG",   # flake8-unused-arguments
    "PERF",  # perflint
    "TID",   # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
# assert is idiomatic in pytest; test fixtures (including fake credentials)
# aren't a security surface
"**/tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", ".venv", "**/node_modules", "**/.*", "spikes"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Only concerns third-party stub completeness, not our own code's coverage.
reportMissingTypeStubs = false
